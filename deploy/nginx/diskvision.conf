# Nginx reverse proxy template for DiskVisionInspector (TLS termination).
#
# Replace certificates and server_name for your site.

server {
  listen 443 ssl;
  server_name diskvision.local;

  ssl_certificate     /etc/ssl/certs/diskvision.crt;
  ssl_certificate_key /etc/ssl/private/diskvision.key;

  location / {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

